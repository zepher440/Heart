<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="画爱心">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href='data:application/manifest+json,{"name":"%E7%94%BB%E7%88%B1%E5%BF%83","short_name":"%E7%94%BB%E7%88%B1%E5%BF%83","display":"standalone","orientation":"portrait","background_color":"%230b0110","theme_color":"%23ff6ba8","start_url":"."}'>
<title>画爱心 ♥</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
  body{
    background:radial-gradient(ellipse at 50% 38%,#2a0a1e 0%,#150311 55%,#06000a 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#ffd9ec;
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;
         -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  /* 顶部文案 */
  .top{
    position:fixed;left:0;right:0;z-index:5;pointer-events:none;text-align:center;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    padding:0 18px;transition:opacity .7s;
  }
  .msg{font-size:17px;font-weight:600;color:#ffb3d4;letter-spacing:1px;
       text-shadow:0 0 18px rgba(255,107,168,.55);line-height:1.6}
  .tip{font-size:12.5px;color:rgba(255,190,220,.6);letter-spacing:.5px;line-height:1.75;margin-top:6px}
  .tip b{color:#ff9dc6;font-weight:600}
  .top.hide{opacity:0}

  /* 底部操作栏（含安全区） */
  .hud{
    position:fixed;left:0;right:0;z-index:6;
    bottom:0;
    padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(to top,rgba(6,0,10,.82),rgba(6,0,10,0));
  }
  .hud button{
    appearance:none;font-family:inherit;font-size:13.5px;letter-spacing:.5px;
    min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,143,190,.42);
    background:rgba(255,120,180,.12);color:#ffd0e4;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .16s,background .16s,border-color .16s;
  }
  .hud button:active{transform:scale(.95);background:rgba(255,120,180,.3)}
  .hud button.on{background:#ff6ba8;color:#2b0014;border-color:#ff9dc6;font-weight:600}

  /* 微信提示条 */
  .wx{
    position:fixed;left:50%;transform:translateX(-50%);z-index:8;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    max-width:88vw;display:none;align-items:center;gap:8px;
    padding:9px 14px;border-radius:12px;font-size:12.5px;line-height:1.5;
    background:rgba(20,4,16,.92);border:1px solid rgba(255,143,190,.35);color:#ffc9e2;
    box-shadow:0 8px 26px rgba(0,0,0,.5);
  }
  .wx.show{display:flex}
  .wx span{white-space:nowrap}

  /* 保存图片浮层：手机上长按即可保存 */
  .save{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(4,0,7,.94);backdrop-filter:blur(4px);
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;
  }
  .save.show{display:flex}
  .save img{max-width:100%;max-height:68vh;border-radius:14px;
            box-shadow:0 0 40px rgba(255,107,168,.35)}
  .save p{font-size:13.5px;color:#ffc9e2;letter-spacing:.5px;text-align:center;line-height:1.7}
  .save button{
    appearance:none;font-family:inherit;font-size:14px;min-height:44px;padding:0 22px;
    border-radius:999px;border:1px solid rgba(255,143,190,.45);
    background:rgba(255,120,180,.16);color:#ffd0e4;cursor:pointer;
  }
  @media (max-width:360px){
    .hud button{font-size:12.5px;padding:0 11px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="top" id="top">
  <div class="msg" id="msg" style="display:none"></div>
  <div class="tip" id="tip">
    按住屏幕滑动，画出你的爱心<br>
    <b>自动画心</b> 会替你描一颗 ♥
  </div>
</div>

<div class="wx" id="wx"><span>↗ 右上角 ··· →「在浏览器打开」可全屏，体验更好</span></div>

<div class="hud">
  <button id="btnAuto">自动画心 ✧</button>
  <button id="btnSpark" class="on">粒子</button>
  <button id="btnGlow" class="on">柔光</button>
  <button id="btnClear">清空</button>
  <button id="btnSave">保存图片</button>
</div>

<div class="save" id="saveWrap">
  <img id="saveImg" alt="爱心">
  <p id="saveHint">长按图片 → 保存到相册</p>
  <button id="saveClose">关闭</button>
</div>

<script>
(() => {
  "use strict";

  /* ============================================================
     可自定义（想写给她的话就改这里）
     ============================================================ */
  const CONFIG = {
    message: "",          // 例如："to 小笨蛋" —— 留空则不显示
    autoStart: true,      // 打开后自动画一颗心
    startDelay: 700,      // 自动画心的延迟(ms)
  };
  /* ============================================================ */

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const topEl = document.getElementById("top");
  const tipEl = document.getElementById("tip");
  const msgEl = document.getElementById("msg");
  const wxEl  = document.getElementById("wx");

  const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (CONFIG.message) { msgEl.textContent = CONFIG.message; msgEl.style.display = "block"; }
  if (isWeChat) { wxEl.classList.add("show"); setTimeout(() => wxEl.classList.remove("show"), 9000); }

  let W = 0, H = 0, DPR = 1, hudH = 0;

  /* ---------- 状态 ---------- */
  const state = { spark: true, glow: true, auto: null };

  // 已完成的笔画烘焙到离屏画布，保证手机上每帧都很轻
  let baked = document.createElement("canvas");
  let bctx  = baked.getContext("2d");
  let current = null;          // 正在画的笔画
  let particles = [];
  let bgGrad = null;
  let autoCount = 0;

  /* ---------- 尺寸 / 背景 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    const hud = document.querySelector(".hud");
    hudH = hud ? hud.getBoundingClientRect().height : 70;

    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const old = baked;
    baked = document.createElement("canvas");
    baked.width  = canvas.width;
    baked.height = canvas.height;
    bctx = baked.getContext("2d");
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (old.width) bctx.drawImage(old, 0, 0, W, H);   // 保留已画内容

    bgGrad = ctx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, Math.max(W, H) * 0.78);
    bgGrad.addColorStop(0, "#2a0a1e");
    bgGrad.addColorStop(0.55, "#150311");
    bgGrad.addColorStop(1, "#06000a");
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 220));
  resize();

  /* ---------- 心形参数方程 ---------- */
  function heartPoint(t, s, cx, cy) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: cx + x * s, y: cy - y * s };
  }
  function heartPath(s, cx, cy, steps = 240) {
    const p = [];
    for (let i = 0; i <= steps; i++) p.push(heartPoint((i / steps) * Math.PI * 2, s, cx, cy));
    return p;
  }

  /* ---------- 笔画绘制（画到任意 ctx） ---------- */
  function renderStroke(c, s, alpha) {
    const pts = s.pts;
    if (!pts.length) return;
    if (pts.length === 1) {
      c.beginPath();
      c.fillStyle = `hsla(${s.hue},100%,74%,${alpha})`;
      c.arc(pts[0].x, pts[0].y, 3, 0, Math.PI * 2);
      c.fill();
      return;
    }
    c.lineCap = "round";
    c.lineJoin = "round";

    const trace = () => {
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
        c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      c.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    };

    if (state.glow) {
      trace();
      c.strokeStyle = `hsla(${s.hue},100%,62%,${0.16 * alpha})`;
      c.lineWidth = 16;
      c.stroke();
    }
    // 主线：沿路径做色相渐变
    for (let i = 1; i < pts.length; i++) {
      c.beginPath();
      c.moveTo(pts[i - 1].x, pts[i - 1].y);
      c.lineTo(pts[i].x, pts[i].y);
      c.strokeStyle = `hsla(${(s.hue + i * 0.6) % 360},100%,74%,${alpha})`;
      c.lineWidth = s.w;
      c.stroke();
    }
    // 中心高光
    trace();
    c.strokeStyle = `hsla(${(s.hue + 30) % 360},100%,92%,${0.5 * alpha})`;
    c.lineWidth = Math.max(1, s.w * 0.28);
    c.stroke();
  }

  function bake(s) { renderStroke(bctx, s, 1); }

  /* ---------- 粒子 ---------- */
  const PMAX = (W * H) < 420 * 700 ? 420 : 900;

  function spawn(x, y, hue, n, power) {
    if (!state.spark) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (Math.random() * 1.5 + 0.2) * power;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.35 * power,
        life: 1,
        decay: 0.013 + Math.random() * 0.02,
        r: Math.random() * 2.3 + 0.7,
        hue: (hue + (Math.random() * 40 - 20) + 360) % 360,
      });
    }
    if (particles.length > PMAX) particles.splice(0, particles.length - PMAX);
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.globalCompositeOperation = "lighter";
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.014;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      const a = Math.max(0, p.life);
      const r = p.r * (0.4 + p.life * 0.9);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.2);
      g.addColorStop(0, `hsla(${p.hue},100%,78%,${a})`);
      g.addColorStop(1, `hsla(${p.hue},100%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = `hsla(${p.hue},100%,88%,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    const beat = 0.86 + 0.14 * Math.pow(Math.abs(Math.sin(now / 900)), 0.6);

    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = beat;
    ctx.drawImage(baked, 0, 0, W, H);

    if (state.auto) {
      const a = state.auto;
      a.progress += a.speed;
      if (a.progress >= a.path.length) {
        a.stroke.pts = a.path;
        bake(a.stroke);
        current = null;
        state.auto = null;
      } else {
        a.stroke.pts = a.path.slice(0, Math.max(1, Math.floor(a.progress)));
        const p = a.path[Math.max(0, Math.floor(a.progress) - 1)];
        if (Math.random() < 0.8) spawn(p.x, p.y, (340 + a.progress * 0.9) % 360, 2, 0.85);
      }
    }
    if (current) renderStroke(ctx, current, beat);
    ctx.globalAlpha = 1;

    drawParticles();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 输入 ---------- */
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const s = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: s.clientX - r.left, y: s.clientY - r.top };
  }
  let down = false;

  function start(e) {
    if (state.auto || saveWrap.classList.contains("show")) return;
    down = true;
    hideTop();
    const p = pos(e);
    current = { pts: [p], hue: Math.random() * 360, w: 5 };
    spawn(p.x, p.y, current.hue, 6, 1.4);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    if (e.cancelable) e.preventDefault();
  }
  function move(e) {
    if (!down || !current || state.auto) return;
    const p = pos(e);
    const last = current.pts[current.pts.length - 1];
    const d = Math.hypot(p.x - last.x, p.y - last.y);
    if (d < 2.2) { if (e.cancelable) e.preventDefault(); return; }
    current.pts.push(p);
    spawn(p.x, p.y, (current.hue + current.pts.length * 0.5) % 360,
          Math.min(3, 1 + Math.floor(d / 8)), 0.9);
    if (e.cancelable) e.preventDefault();
  }
  function end() {
    if (!down) return;
    down = false;
    if (current && current.pts.length > 1) bake(current);
    current = null;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", end);
  window.addEventListener("touchcancel", end);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- 自动画心 ---------- */
  const btnAuto  = document.getElementById("btnAuto");
  const btnSpark = document.getElementById("btnSpark");
  const btnGlow  = document.getElementById("btnGlow");
  const btnClear = document.getElementById("btnClear");
  const btnSave  = document.getElementById("btnSave");
  const saveWrap = document.getElementById("saveWrap");
  const saveImg  = document.getElementById("saveImg");
  const saveHint = document.getElementById("saveHint");

  function autoHeart() {
    if (state.auto) return;
    hideTop();
    const usableH = H - hudH * 1.15;
    const base = Math.min(W * 0.9, usableH * 0.82) / 34;
    const s  = base * (1 + (autoCount % 3) * 0.07);
    const cx = W / 2;
    const cy = usableH * 0.52 + Math.min(W, usableH) * 0.06;
    autoCount++;
    state.auto = {
      path: heartPath(s, cx, cy, 240),
      progress: 1,
      speed: 1.7,
      stroke: { pts: [], hue: (340 + autoCount * 26) % 360, w: 5 },
    };
  }

  function clearAll() {
    bctx.clearRect(0, 0, W, H);
    particles = [];
    current = null;
    state.auto = null;
    autoCount = 0;
    showTop();
  }

  function toggle(btn, key) {
    state[key] = !state[key];
    btn.classList.toggle("on", state[key]);
  }

  btnAuto.addEventListener("click", autoHeart);
  btnSpark.addEventListener("click", () => toggle(btnSpark, "spark"));
  btnGlow.addEventListener("click", () => toggle(btnGlow, "glow"));
  btnClear.addEventListener("click", clearAll);

  btnSave.addEventListener("click", () => {
    // 把当前画面合成到一张临时画布（补上背景），再交给用户长按保存
    const out = document.createElement("canvas");
    out.width = canvas.width;
    out.height = canvas.height;
    const octx = out.getContext("2d");
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 注意：CanvasGradient 在部分内核里跨 context 复用不可靠，这里重建一份
    const g2 = octx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, Math.max(W, H) * 0.78);
    g2.addColorStop(0, "#2a0a1e");
    g2.addColorStop(0.55, "#150311");
    g2.addColorStop(1, "#06000a");
    octx.fillStyle = g2;
    octx.fillRect(0, 0, W, H);
    octx.drawImage(baked, 0, 0, W, H);
    if (current) renderStroke(octx, current, 1);

    const url = out.toDataURL("image/png");

    if (!isIOS && !isWeChat) {
      const a = document.createElement("a");
      a.download = "heart-" + Date.now() + ".png";
      a.href = url;
      a.click();
      return;
    }
    // iOS / 微信：<a download> 常被忽略或静默失败，改为长按保存
    saveImg.src = url;
    saveHint.textContent = isWeChat
      ? "长按图片 → 保存到相册，或「发送给朋友」"
      : "长按图片 → 存储到照片";
    saveWrap.classList.add("show");
  });

  document.getElementById("saveClose").addEventListener("click", () => saveWrap.classList.remove("show"));
  saveWrap.addEventListener("click", e => { if (e.target === saveWrap) saveWrap.classList.remove("show"); });

  /* ---------- 顶部文案 ---------- */
  let topTimer = null;
  function hideTop() { topEl.classList.add("hide"); if (topTimer) clearTimeout(topTimer); }
  function showTop()  {
    topEl.classList.remove("hide");
    if (topTimer) clearTimeout(topTimer);
    topTimer = setTimeout(hideTop, 6000);
  }
  showTop();

  /* ---------- 开场 ---------- */
  if (CONFIG.autoStart) setTimeout(autoHeart, CONFIG.startDelay);
})();
</script>
</body>
</html>
